[workspace]
resolver = "3"
members = ["crates/ferge-core", "crates/ferge-app", "crates/ferge-bench"]
default-members = ["crates/ferge-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/wirecurl/ferge"
publish = false

# Every version is pinned exactly. GPUI is pre-1.0; upgrades are deliberate,
# separate tasks and never happen as a side effect of `cargo update`.
[workspace.dependencies]
ferge-core = { path = "crates/ferge-core" }

# UI. gpui-component 0.10.0 requires exactly gpui-pre 0.3.12.
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["wayland", "x11", "font-kit"] }
gpui-component = { version = "=0.10.0" }
gpui-component-assets = { package = "gpui-kit-assets", version = "=0.10.0" }
# Window-wide text selection (what gpui-component's Root already mounts).
gpui-base = { version = "=0.10.0" }

# Async runtime and protocol stack.
tokio = { version = "=1.54.1" }
russh = { version = "=0.65.2" }
russh-sftp = { version = "=3.0.1" }
russh-config = { version = "=0.58.0" }

# Persistence. SQLite is bundled so every platform runs the same, tested version.
rusqlite = { version = "=0.43.0", default-features = false, features = ["bundled"] }

# Secrets: platform credential stores, and the encrypted-file fallback.
keyring-core = "=1.1.0"
zbus-secret-service-keyring-store = { version = "=1.0.1", features = ["rt-tokio-crypto-rust"] }
apple-native-keyring-store = { version = "=1.0.2", features = ["keychain"] }
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc"] }
getrandom = "=0.4.3"
zeroize = "=1.9.2"

# Settings: a hand-editable TOML file that keeps comments, watched for changes.
toml_edit = { version = "=0.25.19" }
notify = { version = "=8.2.2" }
# Desktop integration (the XDG desktop portal) on Linux.
zbus = { version = "=5.19.0" }

# File previews: spreadsheets, office documents (ZIP + XML) and PDF pages,
# all in pure Rust so they work everywhere without extra installs.
calamine = { version = "=0.38.0" }
zip = { version = "=9.8.1", default-features = false, features = ["deflate"] }
quick-xml = { version = "=0.42.0" }
hayro = { version = "=0.9.0" }
# Decoded preview images are handed to GPUI as frames (the version GPUI uses).
image = { version = "=0.25.10", default-features = false }
# SVG previews, rendered in the preview worker (the version GPUI uses).
resvg = { version = "=0.46.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
# The preview worker's memory limit: a global allocator with a cap.
cap = { version = "=0.1.2" }

# Support crates.
anyhow = "=1.0.104"
base64ct = "=1.8.3"
bytes = "=1.12.2"
hmac = "=0.13.0"
jiff = "=1.0.1"
sha1 = "=0.11.0"
tokio-util = { version = "=0.7.20", features = ["io"] }
async-trait = "=0.1.92"
clap = { version = "=4.6.9", features = ["derive"] }
dirs = "=7.0.0"
futures = "=0.3.34"
secrecy = "=0.10.3"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
# GPUI's idiomatic `Context<Self>` relies on elided lifetimes.
elided_lifetimes_in_paths = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"
todo = "warn"

[profile.dev]
# GPUI is unusably slow without optimisation; keep our own crates debuggable.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

# CI: no debug info and unoptimised dependencies. Tests need neither, and
# the build takes a fraction of the time on small CI runners.
[profile.ci]
inherits = "dev"
debug = false

[profile.ci.package."*"]
opt-level = 0
