name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Builds use the `ci` profile from Cargo.toml: no debug info, unoptimised
# dependencies. The small runners need several times longer otherwise.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# Actions are pinned to commit SHAs; the comment names the release.
jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - run: cargo fmt --all --check

  deny:
    name: Licenses and advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny@0.22.0
      - run: cargo deny check

  packaging:
    name: Packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends appstream desktop-file-utils shellcheck
      - name: Shell scripts
        run: shellcheck -x packaging/*.sh packaging/*/*.sh
      - name: Desktop file
        run: desktop-file-validate packaging/linux/com.wirecurl.ferge.desktop
      - name: AppStream metainfo
        run: appstreamcli validate --no-net packaging/linux/com.wirecurl.ferge.metainfo.xml

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libfontconfig-dev libfreetype-dev libx11-xcb-dev libxcb1-dev
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --profile ci -- -D warnings
      - name: Build the tests
        run: cargo test --workspace --locked --profile ci --no-run
      - name: Tests
        timeout-minutes: 5
        run: cargo test --workspace --locked --profile ci
      - name: Start the SFTP and FTP test servers
        run: ./testserver/up.sh
      - name: SFTP integration tests
        timeout-minutes: 5
        run: cargo test --workspace --test sftp --locked --profile ci -- --ignored
      - name: FTP integration tests
        timeout-minutes: 5
        run: cargo test --workspace --test ftp --locked --profile ci -- --ignored
      - name: Direct transfer integration tests
        timeout-minutes: 15
        run: cargo test --workspace --test direct --locked --profile ci -- --ignored
      - name: Stop the test servers
        if: always()
        run: ./testserver/down.sh

  # macOS runner minutes count tenfold for private repositories, so this
  # job runs for main and on request, not for every pull request.
  macos:
    name: macOS
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --profile ci -- -D warnings
      - name: Build the tests
        run: cargo test --workspace --locked --profile ci --no-run
      - name: Tests
        timeout-minutes: 5
        run: cargo test --workspace --locked --profile ci
