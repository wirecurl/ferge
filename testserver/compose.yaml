# Started by ./testserver/up.sh, which creates the client keys first.
name: ferge-testserver

services:
  sshd:
    build: .
    image: ferge-testserver:latest
    ports:
      - "127.0.0.1:2222:22"
    volumes:
      - ../.testserver/authorized_keys:/etc/ferge/authorized_keys:ro
    restart: unless-stopped
