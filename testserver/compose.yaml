# Started by ./testserver/up.sh, which creates the client keys first.
#
# sshd is the main test server. sshd2 is a second, empty one for direct
# transfers between two servers; inside the compose network they reach each
# other as sshd:22 and sshd2:22. ftp serves the same fixtures over FTP with
# explicit and implicit TLS; its passive ports are mapped one to one, since
# the server announces them.
name: ${FERGE_TESTSERVER_NAME:-ferge-testserver}

services:
  sshd:
    build: .
    image: ${FERGE_TESTSERVER_NAME:-ferge-testserver}:latest
    ports:
      - "127.0.0.1:${FERGE_TEST_PORT:-2222}:22"
    volumes:
      - ../.testserver/authorized_keys:/etc/ferge/authorized_keys:ro
    restart: unless-stopped

  sshd2:
    build: .
    image: ${FERGE_TESTSERVER_NAME:-ferge-testserver}:latest
    depends_on:
      - sshd
    environment:
      FERGE_FIXTURES: none
    ports:
      - "127.0.0.1:${FERGE_TEST_PORT2:-2223}:22"
    volumes:
      - ../.testserver/authorized_keys:/etc/ferge/authorized_keys:ro
    restart: unless-stopped

  ftp:
    build: .
    image: ${FERGE_TESTSERVER_NAME:-ferge-testserver}:latest
    depends_on:
      - sshd
    # vsftpd as process 1 exits now and then when a connection ends.
    init: true
    environment:
      FERGE_SERVICE: ftp
      FERGE_FTP_PASV_MIN: ${FERGE_TEST_FTP_PASV_MIN:-30000}
      FERGE_FTP_PASV_MAX: ${FERGE_TEST_FTP_PASV_MAX:-30019}
    ports:
      - "127.0.0.1:${FERGE_TEST_FTP_PORT:-2121}:21"
      - "127.0.0.1:${FERGE_TEST_FTPS_PORT:-2990}:990"
      - "127.0.0.1:${FERGE_TEST_FTP_PLAIN_PORT:-2122}:2100"
      - "127.0.0.1:${FERGE_TEST_FTP_PASV_MIN:-30000}-${FERGE_TEST_FTP_PASV_MAX:-30019}:${FERGE_TEST_FTP_PASV_MIN:-30000}-${FERGE_TEST_FTP_PASV_MAX:-30019}"
    healthcheck:
      test: ["CMD-SHELL", "test -f /run/ferge-fixtures-ready && nc -z 127.0.0.1 21 && nc -z 127.0.0.1 990 && nc -z 127.0.0.1 2100"]
      interval: 1s
      timeout: 2s
      start_period: 120s
      retries: 3
    restart: unless-stopped
