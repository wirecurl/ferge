# Test server only. Never use this configuration on a reachable host.
#
# ProFTPD next to vsftpd, because it answers MLSD and MLST (RFC 3659) and
# sets times with MFMT, which vsftpd does not. Explicit TLS (AUTH TLS) on
# port 2101; the entrypoint appends PassivePorts.
ServerName "ferge test (proftpd)"
ServerType standalone
DefaultServer on
Port 2101
UseIPv6 off
User nobody
Group nobody
Umask 022
MaxInstances 200
UseReverseDNS off
# The test users log in with /bin/sh, which is enough; no chroot, so that
# paths are the same as over SFTP.
RequireValidShell off
AllowOverwrite on
ShowSymlinks on
TimesGMT on
# Lists hidden files too, like ls -a.
ListOptions "-a"
MasqueradeAddress 127.0.0.1
DelayEngine off
WtmpLog off
ScoreboardFile /run/proftpd/scoreboard
PidFile /run/proftpd/proftpd.pid

ModulePath /usr/lib/proftpd
LoadModule mod_tls.c

<IfModule mod_tls.c>
    TLSEngine on
    TLSRequired off
    TLSProtocol TLSv1.2 TLSv1.3
    TLSECCertificateFile /etc/ferge-ftp/cert.pem
    TLSECCertificateKeyFile /etc/ferge-ftp/key.pem
    TLSVerifyClient off
    # By default, as with vsftpd above, a data connection must resume the
    # control connection's TLS session.
</IfModule>
