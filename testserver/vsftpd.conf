# Test server only. Never use this configuration on a reachable host.
#
# Explicit TLS (AUTH TLS) on port 21; plain FTP is allowed too, so that
# ferge's question before an unencrypted login can be tested. The entrypoint
# starts a second instance with implicit TLS on port 990 from this file.
listen=YES
listen_ipv6=NO
listen_port=21
background=NO
seccomp_sandbox=NO

anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
chroot_local_user=NO
# Lists hidden files too, like ls -a.
force_dot_files=YES
dirmessage_enable=NO
xferlog_enable=NO
# The benchmarks and the parallel transfers open many connections.
max_clients=200
max_per_ip=100

connect_from_port_20=NO
pasv_enable=YES
pasv_address=127.0.0.1
# pasv_min_port and pasv_max_port are appended by the entrypoint.

ssl_enable=YES
rsa_cert_file=/etc/ferge-ftp/cert.pem
rsa_private_key_file=/etc/ferge-ftp/key.pem
allow_anon_ssl=NO
force_local_logins_ssl=NO
force_local_data_ssl=NO
# As on most servers: a data connection must resume the control
# connection's TLS session.
require_ssl_reuse=YES
ssl_ciphers=HIGH
